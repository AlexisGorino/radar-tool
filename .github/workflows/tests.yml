name: tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js
      - run: node tests/jd-bank.js
      - run: node tests/locations.js
      - run: node tests/ai.js
      - run: node tests/tracking.js
      - run: node tests/market-matrix.js
      - run: node tests/pdf-text.js
      - run: node tests/review-quality.js
      - run: node tests/docx.js
      - run: node tests/outcome.js

  browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run start:test
          wait-on: http://127.0.0.1:8766
          command: npm run test:e2e
