name: tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node tests/build-stamp.js
      - run: npm run check:angular
      - run: npm run test:unit

  browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx cypress install
      - uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run start:angular
          wait-on: http://127.0.0.1:8766
          command: npm run test:e2e
